<style>
:root{color-scheme:dark;--bg:#111b19;--panel:#172623;--ink:#eef4e8;--muted:#aabdb4;--line:#355049;--mint:#a9e9b8;--blue:#a9bfef;font:15px/1.5 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}a{color:var(--mint);text-decoration:none}a:hover{text-decoration:underline}header,main,footer{max-width:1550px;margin:auto;padding-inline:clamp(16px,4vw,56px)}header{padding-block:25px 24px}nav{display:flex;justify-content:space-between;gap:12px;font-size:.85rem}h1,h2,h3,p{margin:0}h1{font:500 clamp(2.6rem,6vw,5.6rem)/1 Georgia,serif;letter-spacing:-.065em;margin:29px 0 12px}header p{color:var(--muted);font-size:1.05rem;max-width:55ch}.explorer{border:1px solid var(--line);overflow:hidden;background:var(--panel)}.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--line)}button,label{font:inherit}button{color:inherit;cursor:pointer;background:#20332e;border:1px solid #425e55;padding:6px 11px}button:hover,button[aria-pressed=true]{background:#334e44}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:3px}button:disabled{opacity:.45;cursor:default}select{background:#20332e;color:inherit;border:1px solid #425e55;padding:7px}label{color:var(--muted);display:flex;align-items:center;gap:7px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,300px)}.viewport{height:clamp(500px,66vh,730px);position:relative;overflow:hidden;background:#12201c radial-gradient(#38534a 1px,transparent 1px) 0 0/20px 20px;cursor:grab;touch-action:none}.viewport.dragging{cursor:grabbing}svg#graph{display:block;width:100%;height:100%}.edge{fill:none;stroke:var(--accent);stroke-opacity:.31;stroke-width:1.6}.edge.active{stroke-opacity:1;stroke-width:2}.node{cursor:pointer;outline:none}.node:hover rect,.node:focus-visible rect,.node.selected rect{stroke:var(--accent);stroke-width:2}.a{--accent:var(--mint)}.b{--accent:var(--blue)}.node text{pointer-events:none;fill:var(--ink);font-size:14px;font-weight:600}.node .code{fill:var(--accent);font:10px ui-monospace,monospace;letter-spacing:.05em}.dim{opacity:.38}.tooltip{position:absolute;max-width:250px;z-index:2;pointer-events:none;background:#0f1c18;border:1px solid var(--line);padding:9px 11px;font-size:.82rem;box-shadow:0 9px 24px #0005}.detail{padding:22px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:13px;min-width:0}.detail h2{font:500 2rem/1 Georgia,serif;letter-spacing:-.035em}.detail p{color:var(--muted)}.meta{color:var(--accent);font: .73rem ui-monospace,monospace;letter-spacing:.05em}.links{display:grid;gap:7px;margin-top:3px}.links button{text-align:left}.footbar{padding:9px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem;display:flex;justify-content:space-between;gap:10px}.build{margin:28px 0}.build h2{font:500 2rem Georgia,serif}.build ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));padding:0;list-style:none;gap:9px}.build button{width:100%;height:100%;text-align:left;padding:11px}.build small{display:block;color:var(--mint)}footer{color:var(--muted);padding-bottom:24px;font-size:.85rem}[hidden]{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr}.viewport{height:440px}.detail{border-left:0;border-top:1px solid var(--line)}.footbar{flex-wrap:wrap}}
.detail{min-height:0}.detail-copy{overflow:auto}.links{margin-top:auto;grid-template-rows:repeat(3,auto)}.links button{min-height:38px}.links .empty{visibility:hidden}.links .expands{border-style:dashed;color:var(--muted);background:transparent}.links .expands:hover{color:var(--ink);background:#20332e}.detail h2{margin-bottom:8px}@media(max-width:760px){.detail{min-height:340px}}
.viewport.flight{cursor:default}.flight #graph{position:relative}.flight .edge{stroke-width:2}.flight .edge.incoming{color:var(--accent);stroke:url(#parent-fade);stroke-opacity:1}

:root{color-scheme:light;--bg:#f6f9fa;--panel:#fff;--ink:#112a3e;--muted:#526876;--line:#bdcfda;--mint:#006eb1;--blue:#245a7a;font-family:Arial,sans-serif}
nav{align-items:center}nav a{display:inline-flex;align-items:center;gap:9px;font-weight:700}nav img{object-fit:contain}nav span{color:var(--muted)}
h1,.detail h2,.build h2{font-family:Arial,sans-serif;font-weight:700}h1{font-size:clamp(2.35rem,5.3vw,4.65rem);letter-spacing:-.055em}.detail h2{font-size:1.7rem;line-height:1.12}
button,select{background:#f6f9fa;border-color:#b2c9d7}button:hover,button[aria-pressed=true],.links .expands:hover{background:#dceffc}
.viewport{background:#e9f3f8 radial-gradient(#b5cdda 1px,transparent 1px) 0 0/20px 20px}
.explorer,button,select,.tooltip{border-radius:0}
.node .code{font-weight:700}.tooltip{background:#fff;box-shadow:0 9px 24px #112a3e24}

.a{--accent:#a64b12;--branch-color:#e46d23}.b{--accent:#245a7a;--branch-color:#006eb1}.root{--accent:#526876}
.node rect{fill:#fff;stroke:color-mix(in srgb,var(--accent) 45%,white);stroke-width:1}
.node:not(.root) rect{fill:color-mix(in srgb,var(--branch-color) var(--tint),white)}
.node[data-depth="1"]{--tint:5%}.node[data-depth="2"]{--tint:10%}
.node[data-depth="3"]{--tint:15%}.node[data-depth="4"]{--tint:20%}
.node:hover rect,.node:focus-visible rect,.node.selected rect{stroke:var(--accent);stroke-width:2}
.flight-copy{font:13px/1.34 Arial,sans-serif;color:var(--ink);margin:0;overflow-wrap:anywhere}.flight .node text:not(.code){font-size:16px}.flight .node foreignObject{pointer-events:none}
</style>

["A1","A","Assemble inputs","Freeze the task and turn selected CSV cells, documents, JSON values, or webpages into source records."],
["A2","A","Compute and validate","Run a Python operation or ask local Ollama for structured output. Check the returned type, allowed values, and evidence."],
["B1","B","Execute jobs durably","Store tasks and rows in SQLite. A background worker claims work, checkpoints results, and recovers interrupted rows."],
["B2","B","Give users control","Build a job form and dashboard, then provide ways to review decisions, export results, and assess quality."],
["A1a","A1","Freeze the task","Save the rubric, expected fields, model identity, and enabled capabilities when a job starts."],
["A1b","A1","Collect evidence","Standardize how readers return evidence. Give each source an ID, provenance, and a bounded excerpt."],
["A2a","A2","Choose computation","Run precise transformations in Python. Route language judgments through a local Ollama adapter."],
["A2b","A2","Validate and flag","Check the schema and quoted evidence. Represent missing information and uncertainty explicitly."],
["B1a","B1","Store and claim work","Link original input rows to versioned jobs and per-row work records. Claim work through a transaction."],
["B1b","B1","Checkpoint and recover","Save each completed row and requeue interrupted work after restart."],
["B2a","B2","Wire up the interface","Use a browser form to configure jobs and a polling dashboard to display saved progress and controls."],
["B2b","B2","Inspect and measure","Export traceable results. Compare predictions with independently labeled examples."],
["A1a.1","A1a","Define the contract","Start with one text column and one integer score from 1 to 5. Write one rule per score and specify what happens when a passage is blank or unclear. Try submitting a task with an invalid score range."],
["A1a.2","A1a","Version settings","Hash the stored task JSON and record model tags, digests, and capability versions. Pin documents by content hash. Start a job, change the preset, and check the queued job still uses its original rubric."],
["A1b.1","A1b","Standardize sources","Give a CSV passage the ID csv:1, a document doc:1, and a webpage web:1. Each record holds text and provenance such as a column name, file hash, or URL and retrieval date."],
["A1b.2","A1b","Bound evidence","Limit the text budget. Flag truncation and optionally choose a contiguous keyword-matched excerpt with an offset. For websites, check access rules and limit same-site links. Verify that an excerpt can be located in its source."],
["A2a.1","A2a","Write Python tools","Build one deterministic operation, such as extracting a domain from a URL. Test input-output pairs, then register it as a capability so it can run without Ollama."],
["A2a.2","A2a","Connect Ollama","Send sources, a rubric, and a JSON schema to the local model with bounded threads, context, and timeouts. Test against a fake adapter before using real inference. Add a second model after the first works."],
["A2b.1","A2b","Check schema and quotes","Require a value, status, quote, source ID, and explanation. Reject a string where an integer is required, an out-of-range score, and a quote absent from the claimed source. A matching quote still needs to support the decision."],
["A2b.2","A2b","Handle uncertainty","Keep blank passages missing. A nonempty passage can earn a 1 if the rubric defines it that way. When models disagree, retain their answers and flag the field for review."],
["B1a.1","B1a","Design SQLite tables","Store original inputs, frozen jobs, and results separately. This lets multiple jobs score the same dataset while preserving its original rows."],

["B2a.1","B2a","Build the task form","Start with CSV upload, a text column, a rubric, a model selector, and a five-row sample. Then populate the capabilities panel from the registry and reveal settings such as document filename only when needed."],

    scene.removeAttribute("transform");
    for (const node of nodes.values()) {
      if (flightVisible(node,old) || flightVisible(node,selected)) {
        positions.set(node.id,{node,x:0,y:0});
      }
    }
  }
  const trail = new Set();
  for (let node = selected; node; node = nodes.get(node.parent)) trail.add(node.id);
  for (const {node,x:xx,y:yy} of positions.values()) {
    const parent = positions.get(node.parent);
    const incoming = flight && node===selected && node.parent;
    if (!parent && !incoming) continue;
    if (flight) {
      scene.append(svg("path",{class:`edge ${color(node)} ${incoming?"incoming":""} ${trail.has(node.id)?"active":""}`,
        "data-edge":node.id}));
      continue;
    }
    const start = parent.x+W;
    const middle = (start+xx)/2;
    const midY = (parent.y + yy)/2;
    const path = topDown
      ? `M ${parent.x+W/2} ${parent.y+H/2} C ${parent.x+W/2} ${midY}, ${xx+W/2} ${midY}, ${xx+W/2} ${yy-H/2}`
      : `M ${start} ${parent.y} C ${middle} ${parent.y}, ${middle} ${yy}, ${xx} ${yy}`;
    scene.append(svg("path",{class:`edge ${color(node)} ${trail.has(node.id)?"active":""}`,
      d:path,"data-edge":node.id}));
  }
  const visible = [...positions.values()].sort((a,b)=>
    (flight ? b.node.depth-a.node.depth : a.node.depth-b.node.depth) || (topDown ? a.x-b.x : a.y-b.y));
  for (const {node,x:xx,y:yy} of visible) {
    const group = svg("g",{class:`node ${color(node)} ${node===selected?"selected":""}`,
      role:"button",tabindex:"0","aria-label":node.title,"aria-pressed":String(node===selected),
      "data-node":node.id,"data-depth":node.depth,transform:`translate(${xx} ${yy-H/2})`});
    const cardWidth = flight ? FLIGHT_WIDTH : W;
    group.append(svg("rect",{width:cardWidth,height:H}));
    const code = svg("text",{x:12,y:20,class:"code"});
    code.textContent = node.id==="root" ? "OVERVIEW" : node.id;
    const label = svg("text",{x:12,y:43});
    label.textContent = node.title;
    group.append(code,label);
    if (flight) {
      for (const [type,copy] of [["full",node.text],["preview",firstSentence(node.text)]]) {
        const area=svg("foreignObject",{x:12,y:53,width:cardWidth-24,height:190,"data-copy":type,
          "aria-hidden":"true"});
        const paragraph=document.createElement("p");
        paragraph.className="flight-copy";
        paragraph.textContent=copy;
        area.append(paragraph);
        group.append(area);
      }
    }
    group.addEventListener("click",()=>{if(!moved)show(node);});
    group.addEventListener("keydown",event=>{
      if (["Enter"," "].includes(event.key)) {
        event.preventDefault();
        show(node);
        scene.querySelector(".selected")?.focus();
      }
    });
    group.addEventListener("pointerenter",()=> {
      if (flight || pointers.size) return;
      const bounds = group.getBoundingClientRect(), local = view.getBoundingClientRect();
      const tip = $("tip");
      tip.textContent = node.text.split(/\. /)[0] + (node.text.includes(". ") ? "." : "");
      tip.hidden = false;
      tip.style.left = Math.max(5,Math.min(bounds.left-local.left,view.clientWidth-tip.offsetWidth-5))+"px";
      tip.style.top = Math.max(5,Math.min(bounds.bottom-local.top+7,view.clientHeight-tip.offsetHeight-5))+"px";
    });
    group.addEventListener("pointerleave",()=>{$("tip").hidden=true;});
    scene.append(group);
    if (flight) {
      for(const area of group.querySelectorAll("[data-copy]")) {
        area.dataset.height=area.firstElementChild.scrollHeight+65;
      }
    }
    if (label.getComputedTextLength() > cardWidth-20) {
      label.setAttribute("textLength", cardWidth-20);
      label.setAttribute("lengthAdjust", "spacingAndGlyphs");
    }
  }
  $("detail").className = "detail "+color(selected);
  $("meta").textContent = `LEVEL ${selected.depth} · ${selected.id==="root"?"OVERVIEW":selected.id}`;
  $("title").textContent = selected.title;
  $("explanation").textContent = selected.text;
  $("focus").disabled = !focusRoot && (selected.id==="root" || !selected.children.length);
  $("focus").setAttribute("aria-pressed",String(Boolean(focusRoot)));
  $("focus").textContent = focusRoot ? "Show full tree" : "Focus branch";
  const links = $("links");
  const focusedSlot = links.contains(document.activeElement) ? document.activeElement.dataset.slot : null;
  links.replaceChildren();
  const targets = [nodes.get(selected.parent), ...selected.children];
  for (let slot=0; slot<3; slot++) {
    const node = targets[slot];
    const expands = !flight && node && node.depth > Number(depth.value);
    const fromFirst = targets[0]?.children[0]===selected;
    const back = orientation === "horizontal" ? (fromFirst ? "↙" : "↖") : (fromFirst ? "↗" : "↖");
    const forward = orientation === "horizontal" ? (slot===1 ? "↗" : "↘") : (slot===1 ? "↙" : "↘");
    const label = node ? (slot===0 ? back+" "+node.title : node.title+" "+forward) : "Empty";
    const control = button(label,()=>show(node));
    control.dataset.slot = slot;
    if (!node) {control.className = "empty"; control.disabled = true;}
    if (expands) {
      control.className = "expands";
      control.setAttribute("aria-label",node.title+" (expands tree)");
      control.title = "Expands the tree to the next level";
    }
    links.append(control);
  }
  if (focusedSlot !== null) {
    (links.querySelector(`[data-slot="${focusedSlot}"]:not(:disabled)`) ||
      links.querySelector("button:not(:disabled)"))?.focus({preventScroll:true});
  }
  if (flight) paintFlight(); else if (reset) fit(); else paint();
}
depth.addEventListener("change",()=>{
  while (selected.depth>Number(depth.value)) selected=nodes.get(selected.parent);
  if (focusRoot && focusRoot.depth>Number(depth.value)) focusRoot=null;
  show(selected);
  fit();
});
$("focus").addEventListener("click",()=>{
  focusRoot = focusRoot ? null : selected;
  if (focusRoot && Number(depth.value)===selected.depth) depth.value=selected.depth+1;
  render(true);
});
function flightVisible(node, anchor) {
  if (node.depth < anchor.depth || node.depth > anchor.depth+2) return false;
  while (node.depth > anchor.depth) node=nodes.get(node.parent);
  return node===anchor;
}
function project(node, anchor) {
  const vertical = node.depth-anchor.depth;
  const z = Math.max(-.65,vertical);
  const factor = 1/(1+z*.62);
  const vw = graph.clientWidth, vh = graph.clientHeight;
  const spread = Math.min(vw*.94,910);
  const lane = (lanes.get(node.id)-lanes.get(anchor.id))*2**anchor.depth;
  const size = Math.min(1.23,vw/355)*factor*(vertical>=2 ? .78 : 1);
  return {
    x:vw/2+lane*spread*factor*1.65,
    y:vh*.22+z*vh*.65*factor,
    size,
    alpha:flightVisible(node,anchor) ? [1,.94,.43][vertical] : 0
  };
}
function paintFlight() {
  const old=flightFrom || selected;
  const mix=flightMix;
  const blend=(a,b)=>a+(b-a)*mix;
  const geometry=new Map();
  for (const group of scene.querySelectorAll(".node")) {
    const id=group.dataset.node, node=nodes.get(id);
    const from=project(node,old), to=project(node,selected);
    const p=Object.fromEntries(Object.keys(from).map(key=>[key,blend(from[key],to[key])]));
    const full=group.querySelector('[data-copy="full"]'), preview=group.querySelector('[data-copy="preview"]');
    const role=(anchor)=>!flightVisible(node,anchor) ? "" : node===anchor ? "full" :
      node.parent===anchor.id ? "preview" : "";
    const fromRole=role(old), toRole=role(selected);
    const height=kind=>kind==="full" ? Number(full.dataset.height) :
      kind==="preview" ? Number(preview.dataset.height) : H;
    p.height=blend(height(fromRole),height(toRole));
    geometry.set(id,p);
    group.querySelector("rect").setAttribute("height",p.height);
    group.setAttribute("transform",`translate(${p.x-FLIGHT_WIDTH*p.size/2} ${p.y-p.height*p.size/2}) scale(${p.size})`);
    for (const area of [full,preview]) {
      const kind=area.dataset.copy;
      area.setAttribute("height",Math.max(0,p.height-53));
      area.style.opacity=blend(Number(fromRole===kind),Number(toRole===kind));
    }
    group.style.opacity=p.alpha;
    group.style.pointerEvents=p.alpha>.16 ? "" : "none";
    group.setAttribute("tabindex",p.alpha>.16 ? "0" : "-1");
    group.setAttribute("aria-hidden",String(p.alpha<=.16));
  }
  for (const line of scene.querySelectorAll("[data-edge]")) {
    const node=nodes.get(line.dataset.edge);
    const incoming=line.classList.contains("incoming");
    let a=geometry.get(node.parent);
    if (!a) {
      const parent=nodes.get(node.parent);
      const from=project(parent,old), to=project(parent,selected);
      a={x:blend(from.x,to.x),y:blend(from.y,to.y),size:blend(from.size,to.size),alpha:0};
    }
    const b=geometry.get(node.id);
    const start=a.y+(a.height||H)*a.size/2, end=b.y-b.height*b.size/2, mid=(start+end)/2;
    line.setAttribute("d",`M ${a.x} ${start} C ${a.x} ${mid}, ${b.x} ${mid}, ${b.x} ${end}`);
    if (incoming) {
      const fade=$("parent-fade");
      fade.setAttribute("y2",Math.max(1,end));
      fade.setAttribute("class",color(node));
    }
    line.style.opacity=Math.min(incoming ? 1 : a.alpha,b.alpha);
  }
  $("status").textContent=`Level ${selected.depth} of 4 · ${selected.title}`;
  $("out").disabled=!selected.parent;
  $("in").disabled=!selected.children.length;
}
function startFlight(previous) {
  cancelAnimationFrame(flightFrame);
  const animate=!reduceMotion.matches && selected!==previous;
  flightFrom=animate ? previous : null;
  flightMix=animate ? 0 : 1;
  render(false);
  if (!animate) return;
  const start=performance.now();
  function tick(now) {
    const t=Math.min(1,(now-start)/540);
    flightMix=t*t*(3-2*t);
    if (t<1) {
      paintFlight();
      flightFrame=requestAnimationFrame(tick);
    } else {
      flightFrom=null;
      render(false);
    }
  }
  flightFrame=requestAnimationFrame(tick);
}
function fly(forward, pointerX=graph.clientWidth/2, target=null) {
  if (flightFrom) return;
  if (!forward) {
    if (selected.parent) show(nodes.get(selected.parent));
    return;
  }
  if (!selected.children.length) return;
  let branch=target;
  while (branch && branch.depth>selected.depth+1) branch=nodes.get(branch.parent);
  if (branch?.parent!==selected.id) branch=selected.children[pointerX<graph.clientWidth/2 ? 0 : 1];
  show(branch);
}
function syncOrientation() {
  const flight=isFlight();
  $("orientation").value=orientation;
  depth.disabled=flight;
  $("focus").hidden=flight;
  $("fit").textContent=flight ? "Back to root" : "Fit view";
  $("help").textContent=flight ? "Scroll or pinch out toward a branch to fly in · Reverse to go back · Tap a node to jump"
    : "Drag to pan · Scroll to zoom · Select a node to read it";
  view.classList.toggle("flight",flight);
  for (const [id,label] of [["in",flight?"Fly into a branch":"Zoom in"],["out",flight?"Fly back":"Zoom out"]]) {
    $(id).setAttribute("aria-label",label);
    $(id).disabled=false;
  }
}
$("orientation").addEventListener("change",()=>{
  cancelAnimationFrame(flightFrame);
  flightFrom=null; flightMix=1;
  orientation=$("orientation").value;
  localStorage.setItem("agent-tree-branded-layout",orientation);
  focusRoot=null;
  if (selected.depth>Number(depth.value) && !isFlight()) depth.value=selected.depth;
  syncOrientation();
  render(true);
});
syncOrientation();
$("in").addEventListener("click",()=>isFlight()?fly(true,0):zoom(1.25));
$("out").addEventListener("click",()=>isFlight()?fly(false):zoom(.8));
$("fit").addEventListener("click",fit);
graph.addEventListener("wheel",event=>{
  event.preventDefault(); $("tip").hidden=true;
  const bounds=graph.getBoundingClientRect();
  if (isFlight()) {
    const now=performance.now();
    const fresh=now-lastWheel>180;
    lastWheel=now;
    if (fresh && event.deltaY) fly(event.deltaY<0,event.clientX-bounds.left,
      nodes.get(closestNode(event)?.dataset.node));
    return;
  }
  zoom(Math.exp(-Math.sign(event.deltaY)*.13),event.clientX-bounds.left,event.clientY-bounds.top);
},{passive:false});
graph.addEventListener("pointerdown",event=>{
  if (event.button!==0 || (isFlight() && event.pointerType!=="touch")) return;
  if (!pointers.size) moved=false;
  pointers.set(event.pointerId,[event.clientX,event.clientY]);
  if (isFlight() && pointers.size===2) {
    const [a,b]=pointers.values();
    pinchDistance=Math.hypot(a[0]-b[0],a[1]-b[1]);
    moved=true;
  }
  if (!closestNode(event)) graph.setPointerCapture(event.pointerId);
  $("tip").hidden=true;
});
graph.addEventListener("pointermove",event=>{
  const old=pointers.get(event.pointerId);
  if (!old) return;
  const current=[event.clientX,event.clientY];
  if (isFlight()) {
    pointers.set(event.pointerId,current);
    if (pointers.size!==2) return;
    const [a,b]=pointers.values();
    const distance=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if (!pinchDistance || flightFrom) return;
    const ratio=distance/pinchDistance;
    if (ratio>1.22 || ratio<.82) {
      pinchDistance=0;
      const midpoint=(a[0]+b[0])/2-graph.getBoundingClientRect().left;
      fly(ratio>1,midpoint);
    }
    return;
  }
  const dx=current[0]-old[0],dy=current[1]-old[1];
  if (!moved && Math.hypot(dx,dy)<4) return;
  moved=true;
  if (!graph.hasPointerCapture(event.pointerId)) graph.setPointerCapture(event.pointerId);
  view.classList.add("dragging");
  const other=[...pointers].find(([id])=>id!==event.pointerId)?.[1];
  if (other) {
    const bounds=graph.getBoundingClientRect();
    const distance = Math.hypot(...old.map((value,i)=>value-other[i]));
    const next = Math.hypot(...current.map((value,i)=>value-other[i]));
    if(distance>0 && next>0) zoom(next/distance,(old[0]+other[0])/2-bounds.left,(old[1]+other[1])/2-bounds.top);
  }
  x+=other?dx/2:dx; y+=other?dy/2:dy;
  pointers.set(event.pointerId,current);
  paint();
});
for (const name of ["pointerup","pointercancel","lostpointercapture"]) graph.addEventListener(name,event=>{
  pointers.delete(event.pointerId);
  if(pointers.size<2) pinchDistance=0;
  if(!pointers.size) view.classList.remove("dragging");
});
window.addEventListener("pointerup",event=>pointers.delete(event.pointerId));
window.addEventListener("hashchange",()=>show(nodes.get(location.hash.slice(1))||nodes.get("root"),true));
const steps = [
 ["A2a.2","Score one passage","Validate a score and quote."],
 ["B1b.2","Add SQLite checkpoints","Resume a ten-row job."],
 ["B2a.1","Build the browser UI","Configure and run a job."],
 ["A1b.1","Add local document input","Cite the file named in a row."],
 ["B2b.2","Evaluate model output","Compare agreement and coverage."]
];
steps.forEach(([id,title,description],index)=>{
  const item=document.createElement("li");
  const control=button(title,()=>{
    show(nodes.get(id),true);
    document.querySelector(".explorer").scrollIntoView({block:"start"});
  });
  const small=document.createElement("small");
  small.textContent=`${index+1}. ${description}`;
  control.append(small); item.append(control); $("build").append(item);
});
if (selected.depth>Number(depth.value)) depth.value=selected.depth;
render(true);
new ResizeObserver(()=>isFlight()?paintFlight():fit()).observe(graph);
</script>
</body>
