name: Render tree zoom GIF
on:
  push:
    branches: [gh-pages]
    paths: [".github/workflows/render-tree-zoom.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - run: |
          mkdir frames
          node <<'JS'
          const {chromium}=require('playwright');
          const path=require('node:path');
          (async()=>{
            const browser=await chromium.launch();
            try {
              const page=await browser.newPage({viewport:{width:1200,height:900}});
              await page.goto('file://'+path.resolve('demos/local-ai-agent-tree/index.html'));
              const frames=[];
              const clip=await page.locator('main .explorer, main section').first().boundingBox();
              if (!clip) throw Error('Explorer unavailable');
              const screenshot=async()=>page.screenshot({clip});
              async function hold(n){const frame=await screenshot();for(let i=0;i<n;i++)frames.push(frame);}
              async function zoom(id){
                const card=page.locator('[data-node="'+id+'"] rect');
                const b=await card.boundingBox();
                await page.mouse.move(b.x+b.width/2,b.y+b.height/2);
                await page.mouse.wheel(0,-240);
                for(let i=0;i<10;i++)frames.push(await screenshot());
                await page.waitForTimeout(215);
                await hold(10);
              }
              await hold(13);
              await zoom('A'); await zoom('A2'); await zoom('A2a');
              await page.getByRole('button',{name:'Back to root'}).click();
              for(let i=0;i<10;i++)frames.push(await screenshot());
              await page.waitForTimeout(250);
              await hold(8);
              frames.forEach((frame,i)=>require('node:fs').writeFileSync('frames/'+String(i).padStart(3,'0')+'.png',frame));
            } finally {await browser.close();}
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS
      - run: ffmpeg -framerate 14 -i frames/%03d.png -vf "scale=960:-1:flags=lanczos,split[a][b];[a]palettegen[p];[b][p]paletteuse" -loop 0 Local-AI-Agent-Zoom.gif
      - uses: actions/upload-artifact@v4
        with:
          name: Local-AI-Agent-Zoom
          path: Local-AI-Agent-Zoom.gif
